<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Voltfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e0b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one full-bleed pixel canvas; HUD pinned to safe-area corners; menus are scrolling overlay sheets. */
:root{
  --night:#0e0b16; --panel:#1a1426; --panel2:#261d38; --line:#3d3157;
  --ink:#f1ecff; --muted:#a49ac0; --volt:#ffe14d; --sakura:#ff5c8a; --toxic:#8fd14f; --danger:#ff4d5e;
  --display:'Pixelify Sans','Courier New',monospace; --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);font-size:20px;line-height:1.15;font-variant-ligatures:none}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;font-variant-ligatures:none}
#game{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---------- buttons & panels ---------- */
.btn{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;background:var(--panel2);border:2px solid var(--line);padding:10px 14px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.07),3px 3px 0 #000;text-transform:uppercase}
.btn:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),1px 1px 0 #000}
.btn:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.btn.primary{background:var(--volt);color:#1a1426;border-color:#fff3a8}
.btn.pink{background:var(--sakura);color:#1a0d16;border-color:#ffb3c8}
.btn.ghost{background:transparent}
.btn.small{font-size:14px;padding:6px 10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:12px}
.label{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:2px solid currentColor;display:inline-block}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(14,11,22,.86);
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-family:var(--display);font-size:28px;margin:0;flex:1;min-width:0;text-wrap:balance}
.sup{font-family:var(--display);color:var(--volt);font-size:16px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.muted{color:var(--muted)}
p{margin:0}

/* title */
#scr-title{background:linear-gradient(180deg,rgba(14,11,22,.35),rgba(14,11,22,.9) 70%)}
.title-wrap{max-width:980px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center}
.logo{font-family:var(--display);font-weight:700;line-height:.85;display:grid;margin-top:8px}
.logo span{display:block}
.logo .l1{font-size:clamp(44px,13vw,96px);color:var(--ink);text-shadow:4px 4px 0 var(--sakura),8px 8px 0 #000}
.logo .l2{font-size:clamp(52px,16vw,120px);color:var(--volt);text-shadow:4px 4px 0 #b3541e,8px 8px 0 #000;letter-spacing:.04em}
.tag{font-size:22px;color:var(--muted)}
.lineup{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.lineup .h{display:grid;justify-items:center;gap:4px;animation:bob 1.6s steps(2) infinite}
.lineup .h:nth-child(2){animation-delay:.4s}.lineup .h:nth-child(3){animation-delay:.8s}.lineup .h:nth-child(4){animation-delay:1.2s}
.lineup .n{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@keyframes bob{50%{transform:translateY(-3px)}}
.menu{display:grid;gap:10px;width:min(360px,100%)}
.menu .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted)}
@media (orientation:landscape) and (max-height:560px){
  .title-wrap{grid-template-columns:1fr 1fr;align-items:center;text-align:left;justify-items:start}
  .title-wrap .left{display:grid;gap:12px}
  .logo .l1{font-size:56px}.logo .l2{font-size:72px}
  .lineup{justify-content:flex-start}
}

/* city cards */
.city{display:grid;gap:8px;text-align:left;cursor:pointer;position:relative;padding:12px}
.city .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.city h3{font-family:var(--display);font-size:20px;margin:0}
.city .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:18px}
.pips{letter-spacing:2px;color:var(--danger);font-family:var(--display);font-size:13px}
.city.cleared .chip{color:var(--toxic)}
.city.infected .chip{color:var(--danger)}
.city.locked{opacity:.45;cursor:not-allowed}
.city.locked .chip{color:var(--muted)}
.swatch{height:22px;border:2px solid #000;display:flex}
.swatch i{flex:1}

/* heroine cards */
.hcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;cursor:pointer}
.hcard.sel{border-color:var(--volt);box-shadow:4px 4px 0 #000,0 0 0 2px var(--volt)}
.hcard .pf{background:#0b0912;border:2px solid var(--line);display:block;line-height:0}
.hcard h3{font-family:var(--display);margin:0;font-size:22px}
.stat{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;font-size:16px;color:var(--muted)}
.meter{height:8px;background:#0b0912;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--volt)}
.ptags{display:flex;gap:6px;flex-wrap:wrap}
.ptags span{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:#0b0912;padding:2px 6px;border:1px solid var(--line)}

/* powers */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{display:grid;gap:4px;text-align:left;cursor:pointer;min-width:0}
.slot.sel{border-color:var(--volt);box-shadow:4px 4px 0 #000,0 0 0 2px var(--volt)}
.slot b{font-family:var(--display);font-size:16px;overflow-wrap:anywhere}
.pcard{display:grid;gap:6px;text-align:left;cursor:pointer}
.pcard h3{font-family:var(--display);font-size:18px;margin:0;display:flex;justify-content:space-between;gap:8px}
.pcard.on{border-color:var(--sakura)}
.up{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.up h3{font-family:var(--display);font-size:17px;margin:0}

/* squad */
.roster{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.rrow b{font-family:var(--display);font-size:17px}
.ccard{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.ccard h3{font-family:var(--display);font-size:18px;margin:0}
.ccard .act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* god mode */
.gm{display:grid;gap:10px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.tog b{font-family:var(--display);font-size:17px}
.tog .sw{width:46px;height:24px;border:2px solid var(--line);background:#0b0912;position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--muted)}
.tog.on .sw{background:#3a3210;border-color:var(--volt)}
.tog.on .sw::after{left:24px;background:var(--volt)}
.sl{display:grid;gap:6px;padding:10px 12px}
.sl .top{display:flex;justify-content:space-between;gap:8px}
.sl b{font-family:var(--display);font-size:17px}
.sl output{font-family:var(--display);color:var(--volt);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--volt);height:28px}

/* result */
.result{text-align:center;display:grid;gap:14px;justify-items:center;margin-top:8vh}
.result h2{font-family:var(--display);font-size:clamp(36px,9vw,64px);margin:0;line-height:1}
.result .nums{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;width:min(420px,100%)}
.result .nums div{display:grid;gap:2px}
.result .nums b{font-family:var(--display);font-size:28px;color:var(--volt);font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.hud-tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);display:flex;gap:8px;align-items:center;
  background:rgba(14,11,22,.72);border:2px solid var(--line);padding:6px 8px;pointer-events:none}
.hud-tl .info{display:grid;gap:3px;min-width:120px}
.hud-tl .nm{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.hpbar{width:130px;height:10px;background:#0b0912;border:2px solid #000;position:relative}
.hpbar i{position:absolute;inset:0;right:auto;background:var(--sakura)}
.hud-tl .sm{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud-tl .sm b{color:var(--volt);font-weight:400}
#objective{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;background:rgba(14,11,22,.72);border:2px solid var(--line);padding:5px 10px;white-space:nowrap;pointer-events:none}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:6px;align-items:flex-start}
#minimap{width:84px;height:84px;border:2px solid var(--line);background:#000}
#btnPause{width:40px;height:40px;padding:0;font-size:16px}
#sbx{position:absolute;left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 100px);top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;gap:6px;overflow-x:auto;
  padding-bottom:4px;touch-action:pan-x}
#sbx .btn{flex:none;font-size:12px;padding:6px 8px}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,225,77,.35);border:2px solid var(--volt)}
#hint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);color:var(--muted);font-size:18px;pointer-events:none;
  border:2px dashed var(--line);padding:18px 16px;background:rgba(14,11,22,.4)}
#powers{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:200px;height:190px}
.pw{position:absolute;width:74px;height:74px;padding:0;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;border:3px solid #000;cursor:pointer;
  clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);background:var(--volt);color:#1a1426;--p:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.pw::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(10,8,16,.78) calc(var(--p)*1turn),transparent 0)}
.pw span{position:relative;z-index:1;padding:0 4px}
.pw.cd{color:var(--ink)}
#pw0{right:0;bottom:0;width:88px;height:88px;font-size:12px}
#pw1{right:96px;bottom:4px}
#pw2{right:14px;bottom:96px}
#pw1{background:var(--sakura)}#pw2{background:#9fe8ff}
#btnSquad{position:absolute;right:104px;bottom:96px;width:62px;height:44px;padding:0;font-size:11px}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.2s ease-out forwards}
#banner b{display:block;font-family:var(--display);font-size:clamp(26px,7vw,48px);color:var(--volt);text-shadow:3px 3px 0 #000}
#banner small{font-size:22px;color:var(--ink);text-shadow:2px 2px 0 #000}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}10%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);padding:6px 12px;
  font-size:18px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media (max-width:640px){
  #objective{left:calc(env(safe-area-inset-left,0px) + 8px);transform:none;top:calc(env(safe-area-inset-top,0px) + 66px);font-size:11px}
  #sbx{top:calc(env(safe-area-inset-top,0px) + 96px)}
  .hud-tl .info{min-width:0}.hpbar{width:96px}.hud-tl .sm{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.lineup .h{animation:none}#banner.show{animation-duration:2.2s;animation-timing-function:steps(1)}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="hud-tl">
      <span id="hudFace"></span>
      <div class="info">
        <span class="nm" id="hudName">Raiko</span>
        <div class="hpbar"><i id="hpFill"></i></div>
        <span class="sm">Supplies <b id="hudSup">0</b> · Kills <b id="hudKills">0</b> · Squad <b id="hudSquad">0</b></span>
      </div>
    </div>
    <div id="objective">Nests 0</div>
    <div class="hud-tr"><canvas id="minimap" width="84" height="84"></canvas><button class="btn" id="btnPause" aria-label="Pause">II</button></div>
    <div id="sbx" hidden></div>
    <div id="hint">Drag on the left side to move.<br>Lightning fires on its own.</div>
    <div id="stick" hidden><div id="knob"></div></div>
    <div id="powers">
      <button class="pw" id="pw0"><span>CHAIN</span></button>
      <button class="pw" id="pw1"><span>STORM</span></button>
      <button class="pw" id="pw2"><span>JUDGE</span></button>
      <button class="btn" id="btnSquad">Follow</button>
    </div>
    <div id="banner"><b></b><small></small></div>
  </div>
  <div id="toast"></div>

  <section class="screen" id="scr-title">
    <div class="title-wrap">
      <div class="left">
        <div class="logo"><span class="l1">VOLT</span><span class="l2">FALL</span></div>
        <p class="tag">The cities fell. You are the lightning that takes them back.</p>
        <div class="lineup" id="lineup"></div>
      </div>
      <div class="menu">
        <button class="btn primary" data-go="map">Campaign</button>
        <button class="btn pink" data-go="sandbox">Sandbox</button>
        <div class="row">
          <button class="btn" data-go="heroines">Heroines</button>
          <button class="btn" data-go="powers">Powers</button>
        </div>
        <div class="row">
          <button class="btn" data-go="squad">Squad</button>
          <button class="btn" data-go="god" style="color:var(--volt)">God Mode</button>
        </div>
        <div class="row">
          <button class="btn ghost small" id="btnSound">Sound: on</button>
          <button class="btn ghost small" id="btnFull">Fullscreen</button>
        </div>
        <div class="foot"><span id="titleSup"></span><span id="titleProg"></span></div>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-map" hidden></section>
  <section class="screen" id="scr-sandbox" hidden></section>
  <section class="screen" id="scr-heroines" hidden></section>
  <section class="screen" id="scr-powers" hidden></section>
  <section class="screen" id="scr-squad" hidden></section>
  <section class="screen" id="scr-god" hidden></section>
  <section class="screen" id="scr-pause" hidden></section>
  <section class="screen" id="scr-result" hidden></section>
</div>

<script>
'use strict';
/* =========================================================
   VOLTFALL — pixel zombie liberation game
   ========================================================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
function segDist2(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1);return dist2(px,py,ax+dx*t,ay+dy*t)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>clamp(v+amt,0,255);return'#'+((1<<24)|(f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).slice(1)}

/* ---------------- DATA ---------------- */
const HEROINES=[
  {id:'raiko',name:'Raiko',title:'Thunder Princess',hair:'#2a1f3d',eye:'#ffc83a',outfit:'#2e2860',accent:'#ffd23f',rib:'#ffd23f',stk:'#1a1424',boot:'#3a2a4a',bolt:'#ffe14d',hp:130,spd:62,atk:12,trail:false,
   loadout:['chain','storm','judgment'],blurb:'Calls storms down on whole streets.'},
  {id:'hayate',name:'Hayate',title:'Silver Flash',hair:'#e6e4f2',eye:'#ff4d6d',outfit:'#b81f3e',accent:'#f2eef8',rib:'#2a1a2a',stk:'#f2eef8',boot:'#2a1a24',bolt:'#9fe8ff',hp:100,spd:94,atk:9,trail:true,
   loadout:['dash','blitz','timeslow'],blurb:'Moves faster than the infected can turn.'},
  {id:'shiden',name:'Shiden',title:'Violet Railgun',hair:'#6f3fd8',eye:'#5ef0ff',outfit:'#1f2a44',accent:'#b78cff',rib:'#5ef0ff',stk:'#141b2e',boot:'#2a2a3a',bolt:'#c9a2ff',hp:110,spd:70,atk:14,trail:false,
   loadout:['railgun','orbs','chain'],blurb:'Fires bolts that punch through city blocks.'},
  {id:'kurenai',name:'Kurenai',title:'Crimson Blitz',hair:'#c2182b',eye:'#ffcc33',outfit:'#231d2e',accent:'#ff3355',rib:'#ffcc33',stk:'#120f18',boot:'#4a1a24',bolt:'#ff6a7a',hp:115,spd:82,atk:11,trail:true,
   loadout:['afterimage','dash','storm'],blurb:'Splits into afterimages that fight beside her.'},
];
const HMAP=Object.fromEntries(HEROINES.map(h=>[h.id,h]));

const POWERS={
  chain:{name:'Chain Lightning',short:'CHAIN',cd:2.6,desc:'A bolt leaps between up to 8 infected.'},
  dash:{name:'Thunder Dash',short:'DASH',cd:2.2,desc:'Blink forward and shred everything in the path.'},
  storm:{name:'Storm Field',short:'STORM',cd:9,desc:'Lightning lashes every infected near you for 5s.'},
  timeslow:{name:'Speed Force',short:'SPEED FORCE',cd:14,desc:'The world slows to a crawl. You do not.'},
  afterimage:{name:'Afterimages',short:'AFTER IMAGE',cd:12,desc:'Three speed clones fight beside you for 7s.'},
  judgment:{name:"Heaven's Judgment",short:'JUDGE',cd:16,desc:'Lightning strikes rain on the infected around you.'},
  railgun:{name:'Railgun',short:'RAIL GUN',cd:3.6,desc:'A piercing beam that ignores walls.'},
  blitz:{name:'Blitz Barrage',short:'BLITZ',cd:7,desc:'Teleport-strike the 10 closest infected in a chain.'},
  orbs:{name:'Ball Lightning',short:'ORBS',cd:10,desc:'Charged orbs orbit you and fry anything they touch.'},
};

/* ---------------- PIXEL ART ENGINE ---------------- */
// Sprites are drawn into material maps (one letter = material + tone) and baked with hue-shifted
// 4-tone ramps, rim light and selective outlines. Heroines and bosses are 128px tall and drawn 1:1;
// everything else is 64px and drawn at 2x.
function hexToHsl(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hslToHex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,1);l=clamp(l,0,1);const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];const f=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');return'#'+f(r)+f(g)+f(b)}
const towardHue=(h,t,amt)=>h+clamp(((t-h+540)%360)-180,-amt,amt);
const RAMPS={};
function ramp(hex){if(RAMPS[hex])return RAMPS[hex];const[h,s,l]=hexToHsl(hex);
  return RAMPS[hex]=[hslToHex(towardHue(h,255,26),Math.min(1,s+.1),l*.4),hslToHex(towardHue(h,255,13),Math.min(1,s+.06),l*.7),hex,hslToHex(towardHue(h,50,12),s*.92,l+(1-l)*.34)]}
RAMPS['#ffd9c4']=['#8a5060','#efb6a8','#ffd9c4','#fff1e8'];
const PXM={d:['hair',0],h:['hair',1],H:['hair',2],I:['hair',3],0:['skin',0],s:['skin',1],S:['skin',2],9:['skin',3],b:['blush',2],L:['lash',2],e:['eye',1],E:['eye',2],F:['eye',3],W:['white',2],m:['mouth',2],
  u:['out',0],o:['out',1],O:['out',2],Q:['out',3],c:['col',1],C:['col',2],4:['col',3],a:['acc',1],A:['acc',2],3:['acc',3],r:['rib',1],R:['rib',2],5:['rib',3],
  7:['stk',0],t:['stk',1],T:['stk',2],8:['stk',3],l:['boot',0],x:['boot',1],B:['boot',2],6:['boot',3],
  g:['gear',1],G:['gear',2],J:['gear',3],1:['vest',0],v:['vest',1],V:['vest',2],2:['vest',3],k:['flesh',0],z:['flesh',1],Z:['flesh',2],Y:['flesh',3],q:['cloth',0],n:['cloth',1],N:['cloth',2],U:['cloth',3],
  w:['wound',0],X:['wound',2],j:['bone',2],y:['glow',2],p:['pus',1],P:['pus',2],f:['pus',3]};
const AUTO=new Set(['out','col','stk','boot','gear','vest','cloth','acc']);
class Grid{
  constructor(w,h){this.w=w;this.h=h;this.c=new Array(w*h).fill('.')}
  get(x,y){return x<0||y<0||x>=this.w||y>=this.h?'.':this.c[y*this.w+x]}
  set(x,y,ch){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.c[y*this.w+x]=ch}
  rect(x,y,w,h,ch,clip){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!clip||clip(x+i,y+j))this.set(x+i,y+j,ch)}
  ell(cx,cy,rx,ry,ch,clip){for(let j=Math.floor(cy-ry-1);j<=cy+ry+1;j++)for(let i=Math.floor(cx-rx-1);i<=cx+rx+1;i++){const dx=(i+.5-cx)/rx,dy=(j+.5-cy)/ry;
    if(dx*dx+dy*dy<=1&&(!clip||clip(i,j)))this.set(i,j,typeof ch==='function'?ch(dx,dy,i,j):ch)}}
  sphere(cx,cy,rx,ry,tones,clip){const band=Math.min(.12,1.6/Math.max(rx,ry));this.ell(cx,cy,rx,ry,(dx,dy,i,j)=>{const l=-dx*.55-dy*.8;let t=l>.5?3:l>-.12?2:l>-.6?1:0;
    [.5,-.12,-.6].forEach((v,k)=>{if(Math.abs(l-v)<band&&((i+j)&1))t=l>v?2-k:3-k});return tones[t]},clip)}
  cyl(x,y,w,h,tones){for(let i=0;i<w;i++){const u=(i+.5)/w;this.rect(x+i,y,1,h,tones[u<.22?3:u<.66?2:u<.88?1:0])}}
  poly(pts,ch){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[a,b]of pts){x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b)}
    for(let j=Math.floor(y0);j<=y1;j++)for(let i=Math.floor(x0);i<=x1;i++){const px=i+.5,py=j+.5;let ins=false;
      for(let k=0,l=pts.length-1;k<pts.length;l=k++){const[xi,yi]=pts[k],[xj,yj]=pts[l];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}if(ins)this.set(i,j,ch)}}
  line(x0,y0,x1,y1,ch){x0=Math.floor(x0);y0=Math.floor(y0);x1=Math.floor(x1);y1=Math.floor(y1);let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
    for(let n=0;n<900;n++){this.set(x0,y0,ch);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
}
// draws in a fixed design space and scales it into the grid (S = grid px per design unit)
function drawer(g,S){const r=v=>Math.round(v*S),uc=c=>c&&((i,j)=>c((i+.5)/S,(j+.5)/S));
  return{S,ell:(cx,cy,rx,ry,ch,c)=>g.ell(cx*S,cy*S,Math.max(.6,rx*S),Math.max(.6,ry*S),ch,uc(c)),sphere:(cx,cy,rx,ry,t,c)=>g.sphere(cx*S,cy*S,Math.max(.6,rx*S),Math.max(.6,ry*S),t,uc(c)),
    rect:(x,y,w,h,ch,c)=>g.rect(r(x),r(y),Math.max(1,r(x+w)-r(x)),Math.max(1,r(y+h)-r(y)),ch,uc(c)),cyl:(x,y,w,h,t)=>g.cyl(r(x),r(y),Math.max(1,r(x+w)-r(x)),Math.max(1,r(y+h)-r(y)),t),
    poly:(pts,ch)=>g.poly(pts.map(([a,b])=>[a*S,b*S]),ch),line:(x0,y0,x1,y1,ch)=>g.line(x0*S,y0*S,x1*S,y1*S,ch),px:(x,y,ch)=>g.set(x*S,y*S,ch)}}
function bake(g,pal){const W=g.w+2,H=g.h+2,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true}),img=x.createImageData(W,H),d=img.data;
  const put=(i,j,hex)=>{const n=parseInt(hex.slice(1),16),k=(j*W+i)*4;d[k]=n>>16;d[k+1]=(n>>8)&255;d[k+2]=n&255;d[k+3]=255};
  const filled=(i,j)=>{const m=PXM[g.get(i,j)];return!!(m&&pal[m[0]])};
  for(let j=0;j<g.h;j++)for(let i=0;i<g.w;i++){const m=PXM[g.get(i,j)];if(!m||!pal[m[0]])continue;let t=m[1];
    if(t===2&&AUTO.has(m[0])){if(!filled(i+1,j)||!filled(i,j+1))t=1;else if(!filled(i-1,j)||!filled(i,j-1))t=3}
    put(i+1,j+1,ramp(pal[m[0]])[t])}
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const gi=i-1,gj=j-1;if(filled(gi,gj))continue;
    if(filled(gi,gj-1)||filled(gi-1,gj)){put(i,j,'#120a18');continue}
    const n=filled(gi,gj+1)?g.get(gi,gj+1):filled(gi+1,gj)?g.get(gi+1,gj):null;if(n)put(i,j,shade(ramp(pal[PXM[n][0]])[0],-12))}
  x.putImageData(img,0,0);return c}
function flipOf(c){const w=document.createElement('canvas');w.width=c.width;w.height=c.height;const x=w.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return w}

function mkC(r,sc=1){r=upscale(r,sc);const l=flipOf(r);return{r,l,wr:whiteOf(r),wl:whiteOf(l),w:r.width,h:r.height,sc:1,art:sc}}
const mk=(g,pal,sc)=>mkC(bake(g,pal),sc);

/* ---------- parametric humans: heroines (S=1, 128px), soldiers and infected (S~.47, 64px) ---------- */
// design space is 72 x 128 with feet at y=127; the 3/4 view faces right and is flipped for left
function human(o){
  const S=o.S,g=new Grid(Math.ceil(72*S),Math.ceil(129*S)),D=drawer(g,S),f=o.f||0,sw=[0,1,0,-1][f],bob=f%2,back=o.view==='back',Z=o.kind==='zombie',sol=o.kind==='soldier';

const TILE=16;

function genMap(city,seed){

  const at=(x,y)=>tiles[y*W+x],set=(x,y,v)=>{tiles[y*W+x]=v};

    if(x===0||y===0||x===W-1||y===H-1)set(x,y,T.WALL);else if(isRoadX(x)||isRoadY(y))set(x,y,T.ROAD);else set(x,y,T.GROUND)}

    for(let y=sy;y<sy+s;y++)for(let x=sx;x<sx+s;x++)set(x,y,(x===sx||y===sy||x===sx+s-1||y===sy+s-1)?T.SIDE:T.GROUND);
    const ix=sx+1,iy=sy+1,is=s-2,r=rng();

    const bld=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,T.BUILD);buildings.push({x,y,w,h,roof:th.roof[(rng()*th.roof.length)|0],seed:(rng()*1e9)|0})};

    else if(th.small){fill(T.GRASS);
      for(let k=0;k<5;k++){const w=2+((rng()*2)|0),h=2,x=ix+((rng()*(is-w+1))|0),y=iy+((rng()*(is-h+1))|0);let ok=true;
        for(let j=y-1;j<=y+h&&ok;j++)for(let i=x-1;i<=x+w;i++)if(at(i,j)===T.BUILD){ok=false;break}
        if(ok)bld(x,y,w,h)}
      for(let y=iy;y<iy+is;y++)for(let x=ix;x<ix+is;x++)if(at(x,y)===T.GRASS&&rng()<.08){set(x,y,T.TREE);trees.push({x,y})}}

function updateFlow(){const m=G.map,W=m.W,f=G.flow;f.fill(-1);const q=new Int32Array(W*m.H);let h=0,t=0;
  const s=((G.p.y/TILE)|0)*W+((G.p.x/TILE)|0);f[s]=0;q[t++]=s;
  while(h<t){const c=q[h++],cx=c%W,cy=(c/W)|0,d=f[c]+1;
    if(cx>0&&f[c-1]<0&&!SOLID[m.tiles[c-1]]){f[c-1]=d;q[t++]=c-1}
    if(cx<W-1&&f[c+1]<0&&!SOLID[m.tiles[c+1]]){f[c+1]=d;q[t++]=c+1}
    if(cy>0&&f[c-W]<0&&!SOLID[m.tiles[c-W]]){f[c-W]=d;q[t++]=c-W}
    if(cy<m.H-1&&f[c+W]<0&&!SOLID[m.tiles[c+W]]){f[c+W]=d;q[t++]=c+W}}}

  for(const z of G.zombies){if(z.dead)continue;const i=((z.y/CELL)|0)*gridW+((z.x/CELL)|0);if(grid[i])grid[i].push(z)}}

function update(dt){
  const g=save.god,p=G.p;G.time+=dt;
  for(let i=G.timers.length-1;i>=0;i--){const t=G.timers[i];t.t-=dt;if(t.t<=0){G.timers.splice(i,1);t.fn()}}
  // player
  let mx=stick.dx,my=stick.dy;
  if(keys.size){const kx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),ky=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(kx||ky){mx=kx;my=ky}}
  const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}
  p.moving=len>.15&&!p.locked;
  if(p.moving){const sp=p.spd*g.speed*Math.min(1,len),steps=Math.ceil(sp*dt/3);for(let i=0;i<steps;i++)moveEntity(p,mx*sp*dt/steps,my*sp*dt/steps);
    const l=Math.hypot(mx,my)||1;p.dirx=mx/l;p.diry=my/l;if(Math.abs(mx)>.1)p.face=mx<0?-1:1;p.anim+=dt*(6+sp/12);$('#hint').hidden=true}else p.anim=0;
  p.inv-=dt;p.hp=Math.min(p.maxHp,p.hp+dt*1.5);
  if((G.hime.trail&&p.moving)||G.slowT>0&&p.moving){p.trailT-=dt;if(p.trailT<=0){p.trailT=.05;G.trail.push({x:p.x,y:p.y,t:.25,f:p.face})}}
  for(let i=G.trail.length-1;i>=0;i--){G.trail[i].t-=dt;if(G.trail[i].t<=0)G.trail.splice(i,1)}
  p.atkT-=dt*g.atk;
  if(p.atkT<=0&&!p.locked){const t=nearestEnemy(p.x,p.y,130,null,true);if(t){p.atkT=.32;addBolt(p.x+p.face*4,p.y-9,t.x,t.y-(t.kind==='n'?2:6),G.hime.bolt,1,.1,3);hurt(t,G.hime.atk*pm());sparks(t.x,t.y-5,G.hime.bolt,3);Sfx.play('zap')}else p.atkT=.06}
  for(let i=0;i<3;i++){p.cds[i]=Math.max(0,p.cds[i]-dt);if(held[i]||keys.has(String(i+1))||keys.has('jkl'[i]))tryCast(i)}
  // world time
  const zdt=dt*(G.slowT>0?.18:1)*g.zSpeed;G.slowT=Math.max(0,G.slowT-dt);
  G.flowT-=dt;if(G.flowT<=0){G.flowT=.35;updateFlow()}
  buildGrid();
  for(const z of G.zombies)if(!z.dead)updZombie(z,zdt);
  // nests
  const cap=Math.min(1600,450*g.zDensity);
  for(const n of G.nests){if(n.dead)continue;n.flash-=dt;
    if(dist2(n.x,n.y,p.x,p.y)<420*420&&G.zombies.length<cap){n.spawnT-=zdt;if(n.spawnT<=0){n.spawnT=rand(2.4,4.2)/g.zDensity;
      const z=spawnZombie(rollType(G.city.mix),n.x+rand(-6,6),n.y+rand(4,10),true);sparks(z.x,z.y,'#7a2238',5)}}}
  // squad
  for(const s of G.squad)if(!s.dead)updSoldier(s,dt);
  // clones
  for(let i=G.clones.length-1;i>=0;i--){const c=G.clones[i];c.t-=dt;if(c.t<=0){G.clones.splice(i,1);continue}c.ang+=dt*2.2;c.x=p.x+Math.cos(c.ang)*30;c.y=p.y+Math.sin(c.ang)*22;c.atk-=dt*g.atk;
    if(c.atk<=0){const t=nearestEnemy(c.x,c.y,110);if(t){c.atk=.22;addBolt(c.x,c.y-9,t.x,t.y-6,G.hime.bolt,1,.1,3);hurt(t,14*pm())}else c.atk=.1}}
  // storm
  if(G.storm){const st=G.storm;st.t-=dt;st.tick-=dt;if(st.t<=0)G.storm=null;else if(st.tick<=0){st.tick=.18;const R=75*psz();const list=enemiesIn(p.x,p.y,R);
    for(let k=0;k<Math.min(4*psz(),list.length);k++){const e=list[(Math.random()*list.length)|0];addBolt(p.x+rand(-R,R)*.3,p.y-8+rand(-R,R)*.3,e.x,e.y-6,G.hime.bolt,1,.12,6);hurt(e,20*pm())}if(list.length)Sfx.play('zap')}}
  // orbs
  if(G.orbs){const o=G.orbs;o.t-=dt;o.ang+=dt*4;if(o.t<=0)G.orbs=null;else{const R=30*psz();for(let k=0;k<o.n;k++){const a=o.ang+k*6.283/o.n,ox=p.x+Math.cos(a)*R,oy=p.y-6+Math.sin(a)*R*.8;
    for(const e of enemiesIn(ox,oy+6,9*psz()))if(G.time>(e.orbT||0)){e.orbT=G.time+.25;hurt(e,22*pm());sparks(ox,oy,G.hime.bolt,3)}}}}
  // enemy shots
  for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];s.x+=s.vx*zdt;s.y+=s.vy*zdt;s.t-=zdt;let done=s.t<=0||blocked(s.x,s.y,1);
    if(!done){for(const a of[p,...G.squad])if(!a.dead&&dist2(s.x,s.y,a.x,a.y-4)<36){hurtAlly(a,s.dmg);done=true;break}}
    if(done){G.shots.splice(i,1);sparks(s.x,s.y,'#c6ff4a',4,30)}}
  // particles / fx
  for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;if(q.t<=0)G.parts.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){G.fx[i].t-=dt;if(G.fx[i].t<=0)G.fx.splice(i,1)}
  G.shake=Math.max(0,G.shake-dt*14);G.hurtFlash=Math.max(0,G.hurtFlash-dt);
  if((G.time*10|0)%20===0){G.zombies=G.zombies.filter(z=>!z.dead);G.nests=G.nests.filter(n=>!n.dead);G.squad=G.squad.filter(s=>!s.dead)}
  if(Math.random()<dt*.3&&G.zombies.length)Sfx.play('groan');
  // objectives
  if(!G.sandbox&&!G.ended){const nl=G.nests.some(n=>!n.dead);
    if(!nl&&!G.finalWave){G.finalWave=true;for(const z of G.zombies)z.alert=true;after(2.3,()=>banner('FINAL WAVE','Every infected in the city is coming for you'))}
    if(G.finalWave&&!G.zombies.some(z=>!z.dead))endMission(true)}
  // camera
  const m=G.map,mw=m.W*TILE,mh=m.H*TILE;G.cam.x=clamp(p.x-VW/2,-VW*.3,mw-VW*.7);G.cam.y=clamp(p.y-8-VH/2,-VH*.3,mh-VH*.7);
  G.hudT-=dt;if(G.hudT<=0){G.hudT=.1;updHud()}
}

function updZombie(z,dt){
  const p=G.p,m=G.map;z.flash-=dt;z.atkT-=dt;
  if(z.stun>0){z.stun-=dt;return}
  if(!z.alert){z.wT-=dt;if(z.wT<=0){z.wT=rand(1.5,4);if(Math.random()<.4){z.wx=z.wy=0}else{const a=rand(0,6.283);z.wx=Math.cos(a);z.wy=Math.sin(a);if(z.wx)z.face=z.wx<0?-1:1}}
    if(z.wx||z.wy)moveEntity(z,z.wx*z.spd*.3*dt,z.wy*z.spd*.3*dt);
    const d=dist2(z.x,z.y,p.x,p.y);if(d<140*140)z.alert=true;else if(d<400*400)for(const s of G.squad)if(dist2(z.x,z.y,s.x,s.y)<90*90){z.alert=true;break}
    return}
  let tgt=p,bd=dist2(z.x,z.y,p.x,p.y);for(const s of G.squad){if(s.dead)continue;const d=dist2(z.x,z.y,s.x,s.y);if(d<bd){bd=d;tgt=s}}
  const d=Math.sqrt(bd);let mx=0,my=0;const sp=z.spd;
  if(z.type==='spitter'&&d<115&&d>28&&los(z.x,z.y-4,tgt.x,tgt.y-4)){z.spitT-=dt;if(z.spitT<=0){z.spitT=rand(2,3);const a=Math.atan2(tgt.y-z.y,tgt.x-z.x);G.shots.push({x:z.x,y:z.y-6,vx:Math.cos(a)*85,vy:Math.sin(a)*85,t:2,dmg:z.dmg})}}
  else if(d<100&&los(z.x,z.y-3,tgt.x,tgt.y-3)){mx=(tgt.x-z.x)/(d||1);my=(tgt.y-z.y)/(d||1)}
  else{const W=m.W,tx=(z.x/TILE)|0,ty=(z.y/TILE)|0,c=ty*W+tx,f=G.flow;let best=f[c],bx=-1,by=-1;
    if(best<0){mx=(p.x-z.x)/(d||1);my=(p.y-z.y)/(d||1)}else{
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const nx=tx+ox,ny=ty+oy;if(nx<0||ny<0||nx>=W||ny>=m.H)continue;const n=ny*W+nx;
        if(f[n]<0||f[n]>=best)continue;if(ox&&oy&&(SOLID[m.tiles[ty*W+nx]]||SOLID[m.tiles[ny*W+tx]]))continue;best=f[n];bx=nx;by=ny}
      if(bx>=0){const gx=bx*TILE+8-z.x,gy=by*TILE+8-z.y,gl=Math.hypot(gx,gy)||1;mx=gx/gl;my=gy/gl}else{mx=(tgt.x-z.x)/(d||1);my=(tgt.y-z.y)/(d||1)}}}
  if(mx||my){moveEntity(z,mx*sp*dt,my*sp*dt);if(Math.abs(mx)>.2)z.face=mx<0?-1:1}
  // separation
  const gx=(z.x/CELL)|0,gy=(z.y/CELL)|0;let px=0,py=0;
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const cell=grid[(gy+oy)*gridW+gx+ox];if(!cell||gx+ox<0||gx+ox>=gridW)continue;
    for(const o of cell){if(o===z)continue;const dx=z.x-o.x,dy=z.y-o.y,dd=dx*dx+dy*dy,mn=(z.r+o.r)*.9;if(dd<mn*mn&&dd>.0001){const dl=Math.sqrt(dd),push=(mn-dl)/dl*.5;px+=dx*push;py+=dy*push}}}
  if(px||py)moveEntity(z,clamp(px,-2,2),clamp(py,-2,2));
  if(d<z.r+tgt.r+3&&z.atkT<=0){z.atkT=.9;if(z.type==='bloater'){z.hp=0;killZombie(z)}else hurtAlly(tgt,z.dmg)}
  if(z.type==='boss'){z.slamT-=dt;if(z.slamT<=0&&d<90){z.slamT=6;addRing(z.x,z.y,4,55,'#ff3b6b',.6);G.shake=6;Sfx.play('boom');
    for(const a of[p,...G.squad])if(!a.dead&&dist2(z.x,z.y,a.x,a.y)<55*55)hurtAlly(a,25);
    for(let i=0;i<3;i++)spawnZombie('runner',z.x+rand(-14,14),z.y+rand(-14,14),true)}}
}

function updSoldier(s,dt){
  const p=G.p,c=s.c,g=save.god;s.flash-=dt;s.muzzle-=dt;
  const base=G.squadMode==='follow'?p:G.hold,a=s.i*2.399,rad=18+7*Math.sqrt(s.i);
  const tx=base.x+Math.cos(a)*rad,ty=base.y+Math.sin(a)*rad*.8,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);
  if(G.squadMode==='follow'&&dist2(s.x,s.y,p.x,p.y)>280*280){s.x=p.x;s.y=p.y}
  if(d>3){const sp=Math.min(d*4,82*g.speed);moveEntity(s,dx/d*sp*dt,dy/d*sp*dt);s.anim+=dt*9;if(Math.abs(dx)>1)s.face=dx<0?-1:1}else s.anim=0;
  s.tgtT-=dt;if(s.tgtT<=0||!s.tgt||s.tgt.dead){s.tgtT=.2;s.tgt=nearestEnemy(s.x,s.y,c.range,null,true)}
  if(c.heal){s.healT-=dt;if(s.healT<=0){s.healT=1.1;let low=null,lr=1;for(const a of[p,...G.squad]){if(a.dead)continue;const r=a.hp/(a.maxHp||a.max);if(r<lr&&dist2(a.x,a.y,s.x,s.y)<90*90){lr=r;low=a}}
    if(low){const amt=c.heal*s.dmgMul;if(low.kind==='p')low.hp=Math.min(low.maxHp,low.hp+amt);else low.hp=Math.min(low.max,low.hp+amt);sparks(low.x,low.y-10,'#7dff8a',6,30)}}}
  s.fireT-=dt*g.atk;
  if(s.tgt&&!s.tgt.dead){const t=s.tgt;s.aim=Math.atan2(t.y-s.y,t.x-s.x);s.face=Math.cos(s.aim)<0?-1:1;
    if(s.fireT<=0){s.fireT=c.rate*rand(.9,1.1);s.muzzle=.06;const dmg=c.dmg*s.dmgMul*g.dmg,mx=s.x+Math.cos(s.aim)*7,my=s.y-7+Math.sin(s.aim)*7;
      if(c.pierce){const L=c.range,ex=s.x+Math.cos(s.aim)*L,ey=s.y+Math.sin(s.aim)*L;G.fx.push({k:'tracer',x1:mx,y1:my,x2:ex,y2:ey-7,c:c.a,t:.12,max:.12});
        for(const e of enemiesIn((s.x+ex)/2,(s.y+ey)/2,L/2+10))if(segDist2(e.x,e.y,s.x,s.y,ex,ey)<64)hurt(e,dmg)}
      else if(c.aoe){G.fx.push({k:'tracer',x1:mx,y1:my,x2:t.x,y2:t.y-4,c:c.a,t:.15,max:.15});const tx2=t.x,ty2=t.y;after(.12,()=>{addRing(tx2,ty2,2,c.aoe,'#ff7a3a',.3);sparks(tx2,ty2,'#ffb35a',10,70);
        for(const e of enemiesIn(tx2,ty2,c.aoe))hurt(e,dmg);G.shake=Math.max(G.shake,1.5);Sfx.play('boom')})}
      else if(c.splash){for(let k=0;k<5;k++){const aa=s.aim+rand(-.3,.3);G.fx.push({k:'tracer',x1:mx,y1:my,x2:s.x+Math.cos(aa)*c.range,y2:s.y-7+Math.sin(aa)*c.range,c:c.a,t:.07,max:.07})}
        hurt(t,dmg);for(const e of enemiesIn(t.x,t.y,c.splash))if(e!==t)hurt(e,dmg*.6)}
      else{const aa=s.aim+rand(-.05,.05);G.fx.push({k:'tracer',x1:mx,y1:my,x2:t.x+Math.cos(aa)*2,y2:t.y-5,c:c.a,t:.06,max:.06});hurt(t,dmg)}
      Sfx.play('shot')}}
}

/* ---------------- RENDER ---------------- */
let menuScene=null,OX=0,OY=0;
const SX=wx=>Math.round(wx*RZ-OX),SY=wy=>Math.round(wy*RZ-OY);
function drawSpr(fr,wx,wy,face,white,alpha){const img=face<0?(white?fr.wl:fr.l):(white?fr.wr:fr.r);if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.drawImage(img,SX(wx)-(fr.w>>1),SY(wy)-fr.h+2*fr.art);ctx.globalAlpha=1}
const SHAD={};
function shadow(wx,wy,w){w=Math.max(8,(w/2|0)*2);let s=SHAD[w];if(!s){const h=Math.max(4,w/3|0);s=document.createElement('canvas');s.width=w;s.height=h;const x=s.getContext('2d');
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const dx=(i+.5-w/2)/(w/2),dy=(j+.5-h/2)/(h/2),d=dx*dx+dy*dy;if(d<=1&&(d<.6||((i+j)&1))){x.fillStyle='rgba(6,2,14,.42)';x.fillRect(i,j,1,1)}}SHAD[w]=s}
  ctx.drawImage(s,SX(wx)-(s.width>>1),SY(wy)-(s.height>>1))}
function pxLine(x0,y0,x1,y1,s){let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy,o=s>>1;
  for(let n=0;n<4000;n++){ctx.fillRect(x0-o,y0-o,s,s);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function blitMap(m){const cs=CPX*2,cx0=Math.max(0,Math.floor(OX/cs)),cy0=Math.max(0,Math.floor(OY/cs)),cx1=Math.min(Math.ceil(m.W/CK)-1,Math.floor((OX+LW)/cs)),cy1=Math.min(Math.ceil(m.H/CK)-1,Math.floor((OY+LH)/cs));
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const c=getChunk(m,cx,cy,true);ctx.drawImage(c,cx*cs-OX,cy*cs-OY,cs,cs)}
  // prefetch one chunk around the view per frame
  for(let cy=cy0-1;cy<=cy1+1;cy++)for(let cx=cx0-1;cx<=cx1+1;cx++){if(cx<0||cy<0||cx*CK>=m.W||cy*CK>=m.H)continue;if(!m.chunks.has(cy*4096+cx)){getChunk(m,cx,cy,true);return}}}
function hpBar(wx,wy,w,r,c){const x=SX(wx)-(w>>1),y=SY(wy);ctx.fillStyle='#000';ctx.fillRect(x-2,y-2,w+4,9);ctx.fillStyle='#3a1020';ctx.fillRect(x,y,w,5);ctx.fillStyle=c;ctx.fillRect(x,y,Math.max(0,Math.round(w*r)),5);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x,y,Math.max(0,Math.round(w*r)),2)}
const onScreen=(e,m=40)=>e.x>G.cam.x-m&&e.x<G.cam.x+VW+m&&e.y>G.cam.y-m&&e.y<G.cam.y+VH+m*1.6;
function beginFrame(){ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=K!==1;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#0b0812';ctx.fillRect(0,0,LW,LH)}
function render(){
  beginFrame();
  if(!G||(state!=='play'&&!G.ended)){renderMenu();return}
  const m=G.map,sh=G.shake,p=G.p,h=G.hime;OX=Math.round((G.cam.x+(sh?rand(-sh,sh):0))*RZ);OY=Math.round((G.cam.y+(sh?rand(-sh,sh):0))*RZ);
  blitMap(m);
  for(const n of G.nests){if(n.dead||!onScreen(n))continue;const f=NEST[((G.time*2.5+n.x)|0)%2];shadow(n.x,n.y+3,f.w*f.sc*.9);
    ctx.drawImage(n.flash>0?f.wr:f.r,SX(n.x)-(f.w>>1),SY(n.y)-f.h+40);hpBar(n.x,n.y-17,120,n.hp/n.max,'#ff5c8a')}
  const list=[];
  for(const z of G.zombies)if(!z.dead&&onScreen(z))list.push(z);
  for(const s of G.squad)if(!s.dead)list.push(s);
  list.push(p);for(const c of G.clones)list.push({kind:'c',x:c.x,y:c.y});
  list.sort((a,b)=>a.y-b.y);
  const hs=himeSprite(h),hview=(p.moving&&p.diry<-.45)?hs.back:hs.front;
  for(const t of G.trail)drawSpr(hs.front[0],t.x,t.y,t.f,true,t.t*1.3);
  for(const e of list){
    if(e.kind==='z'){const fr=e.fr,big=e.type==='boss'||e.type==='brute';const f=fr[e.stun>0?0:((G.time*(e.type==='runner'?7:3.5)+e.seed)|0)%fr.length];
      shadow(e.x,e.y,f.w*f.sc*.7);drawSpr(f,e.x,e.y+(big||e.stun>0?0:(Math.sin(G.time*7+e.seed)>0?0:-.25)),e.face,e.flash>0);
      if(big)hpBar(e.x,e.y-f.h*f.sc/RZ-2,e.type==='boss'?150:80,e.hp/e.max,e.type==='boss'?'#ff3b6b':'#8fd14f')}
    else if(e.kind==='s'){const view=Math.sin(e.aim)<-.6&&e.tgt?e.fr.back:e.fr.front,f=view[e.anim?(e.anim|0)%4:0],gs=gunSprites(e.rec.cls);
      const k=((Math.round(e.aim/(Math.PI*2)*16)%16)+16)%16,gi=gs[k],gw=gi.width,gx=SX(e.x+Math.cos(e.aim)*2.5)-(gw>>1),gy=SY(e.y-6)-(gw>>1);
      shadow(e.x,e.y,60);const behind=Math.sin(e.aim)<-.2;if(behind)ctx.drawImage(gi,gx,gy,gw,gw);drawSpr(f,e.x,e.y,e.face,e.flash>0);if(!behind)ctx.drawImage(gi,gx,gy,gw,gw);
      if(e.muzzle>0){const mx=SX(e.x+Math.cos(e.aim)*12),my=SY(e.y-6+Math.sin(e.aim)*12);ctx.fillStyle='#fff4c0';ctx.fillRect(mx-6,my-6,12,12);ctx.fillStyle='#ffb35a';ctx.fillRect(mx-3,my-11,6,22);ctx.fillRect(mx-11,my-3,22,6)}
      if(e.hp<e.max)hpBar(e.x,e.y-18,56,e.hp/e.max,'#7dff8a')}
    else if(e.kind==='p'){const f=hview[p.moving?(p.anim|0)%4:0];shadow(p.x,p.y,64);
      if(G.storm||G.slowT>0){ctx.globalCompositeOperation='lighter';ctx.drawImage(glowOf(h.bolt),SX(p.x)-90,SY(p.y-8)-90,180,180);ctx.globalCompositeOperation='source-over'}
      drawSpr(f,p.x,p.y,p.face,p.inv>0&&((G.time*30|0)%2===0));
      if(Math.random()<.3)sparks(p.x+rand(-7,7),p.y-rand(3,15),h.bolt,1,20)}
    else if(e.kind==='c'){ctx.globalCompositeOperation='lighter';drawSpr(hs.front[1+((G.time*8|0)%3)],e.x,e.y,p.face,false,.5);ctx.globalCompositeOperation='source-over'}
  }
  if(G.orbs){const o=G.orbs,R=30*psz();ctx.globalCompositeOperation='lighter';for(let k=0;k<o.n;k++){const a=o.ang+k*6.283/o.n,ox=SX(p.x+Math.cos(a)*R),oy=SY(p.y-6+Math.sin(a)*R*.8);
    ctx.drawImage(glowOf(h.bolt),ox-48,oy-48,96,96);ctx.fillStyle='#ffffff';ctx.fillRect(ox-7,oy-7,14,14);ctx.fillStyle=h.bolt;ctx.fillRect(ox-11,oy-3,4,6);ctx.fillRect(ox+7,oy-3,4,6);ctx.fillRect(ox-3,oy-11,6,4);ctx.fillRect(ox-3,oy+7,6,4)}ctx.globalCompositeOperation='source-over'}
  if(G.storm){const R=75*psz()*RZ;ctx.globalAlpha=.45+.25*Math.sin(G.time*20);const n=Math.max(48,R/8|0),cx=SX(p.x),cy=SY(p.y-4),off=G.time*2;ctx.fillStyle=h.bolt;
    for(let k=0;k<n;k++){if(k%3===0)continue;const a=k/n*6.283+off;ctx.fillRect(Math.round(cx+Math.cos(a)*R)-3,Math.round(cy+Math.sin(a)*R*.8)-3,6,6)}ctx.globalAlpha=1}
  for(const s of G.shots){const x=SX(s.x),y=SY(s.y);ctx.fillStyle='#3a6a10';ctx.fillRect(x-10,y-10,20,20);ctx.fillStyle='#c6ff4a';ctx.fillRect(x-7,y-7,14,14);ctx.fillStyle='#f4ffd0';ctx.fillRect(x-4,y-6,6,3)}
  for(const q of G.parts){ctx.fillStyle=q.c;const s=(q.s||2)*3;ctx.fillRect(SX(q.x),SY(q.y),s,s)}
  drawFx();
  // night layer (lower resolution, soft) with light cut out around the heroine, lightning and fire
  const dk=m.th.dark||.35;
  if(dk>0){const lw=lightC.width,lh=lightC.height;lctx.setTransform(1,0,0,1,0,0);lctx.globalCompositeOperation='source-over';lctx.globalAlpha=1;lctx.clearRect(0,0,lw,lh);lctx.fillStyle=`rgba(6,3,20,${dk})`;lctx.fillRect(0,0,lw,lh);
    lctx.globalCompositeOperation='destination-out';
    const lt=(wx,wy,r,a=1)=>{lctx.globalAlpha=clamp(a,0,1);const rr=r*LS;lctx.drawImage(LIGHT,SX(wx)*LS-rr,SY(wy)*LS-rr,rr*2,rr*2)};
    lt(p.x,p.y-8,G.storm?1000:680);let nb=0;
    for(const f of G.fx){if(nb>40)break;const a=f.t/f.max;if(f.k==='bolt'){const q=f.pts[f.pts.length-1];lt(q[0],q[1],220+f.w*40,a);nb++}else if(f.k==='beam'){lt((f.x1+f.x2)/2,(f.y1+f.y2)/2,f.w*RZ*14,a);nb++}else if(f.k==='ring'){lt(f.x,f.y,f.r1*RZ*1.2,a*.7);nb++}}
    for(const s of G.squad)if(!s.dead&&s.muzzle>0)lt(s.x,s.y-6,180);
    for(const c of G.clones)lt(c.x,c.y-8,240,.6);
    for(const n of G.nests)if(!n.dead&&onScreen(n))lt(n.x,n.y,170,.35);
    lctx.globalAlpha=1;ctx.imageSmoothingEnabled=true;ctx.drawImage(lightC,0,0,LW,LH);ctx.imageSmoothingEnabled=K!==1}
  ctx.globalCompositeOperation='lighter';
  for(const f of G.fx)if(f.k==='bolt'&&f.t/f.max>.4){const q=f.pts[f.pts.length-1];ctx.globalAlpha=f.t/f.max;ctx.drawImage(glowOf(f.c),SX(q[0])-60,SY(q[1])-60,120,120)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(G.slowT>0){ctx.fillStyle='rgba(90,160,255,.14)';ctx.fillRect(0,0,LW,LH)}
  ctx.imageSmoothingEnabled=true;ctx.drawImage(vignette,0,0,LW,LH);ctx.imageSmoothingEnabled=K!==1;
  for(const f of G.fx)if(f.k==='flash'){ctx.globalAlpha=f.t/f.max*.45;ctx.fillStyle=f.c;ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1}
  if(G.hurtFlash>0){ctx.fillStyle=`rgba(255,40,70,${G.hurtFlash*.7})`;ctx.fillRect(0,0,LW,LH)}

}
function drawFx(){ctx.lineJoin='bevel';ctx.lineCap='square';
  for(const f of G.fx){const a=f.t/f.max;
    if(f.k==='bolt'){ctx.globalCompositeOperation='lighter';ctx.beginPath();f.pts.forEach((q,i)=>{const x=SX(q[0]),y=SY(q[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
      ctx.globalAlpha=a*.35;ctx.strokeStyle=f.c;ctx.lineWidth=(f.w+2)*6;ctx.stroke();ctx.globalAlpha=a*.8;ctx.lineWidth=(f.w+1)*3;ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(2,f.w*1.6);ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
    else if(f.k==='ring'){ctx.globalAlpha=a;ctx.strokeStyle=f.c;ctx.lineWidth=6;const r=(f.r0+(f.r1-f.r0)*(1-a))*RZ;ctx.beginPath();ctx.ellipse(SX(f.x),SY(f.y),r,r*.8,0,0,7);ctx.stroke();ctx.globalAlpha=1}
    else if(f.k==='beam'){ctx.globalCompositeOperation='lighter';ctx.lineCap='butt';ctx.globalAlpha=a*.55;ctx.strokeStyle=f.c;ctx.lineWidth=(f.w*a+2)*RZ;ctx.beginPath();ctx.moveTo(SX(f.x1),SY(f.y1));ctx.lineTo(SX(f.x2),SY(f.y2));ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(4,f.w*a*3);ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.lineCap='square'}
    else if(f.k==='tracer'){ctx.globalAlpha=a;ctx.strokeStyle=f.c;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(SX(f.x1),SY(f.y1));ctx.lineTo(SX(f.x2),SY(f.y2));ctx.stroke();ctx.globalAlpha=1}}}
const mm=$('#minimap'),mctx=mm.getContext('2d');
function drawMini(){if((G.time*10|0)%2)return;const m=G.map;mctx.imageSmoothingEnabled=false;mctx.drawImage(m.mini,0,0,84,84);const k=84/m.W/TILE;
  mctx.fillStyle='#8fd14f';for(let i=0;i<G.zombies.length;i+=2){const z=G.zombies[i];if(!z.dead)mctx.fillRect(z.x*k|0,z.y*k|0,1,1)}
  mctx.fillStyle='#ff5c8a';for(const n of G.nests)if(!n.dead)mctx.fillRect((n.x*k|0)-2,(n.y*k|0)-2,4,4);
  mctx.fillStyle='#9fe8ff';for(const s of G.squad)if(!s.dead)mctx.fillRect(s.x*k|0,s.y*k|0,1,1);
  mctx.fillStyle='#ffe14d';mctx.fillRect((G.p.x*k|0)-1,(G.p.y*k|0)-1,3,3);
  mctx.strokeStyle='rgba(255,255,255,.5)';mctx.lineWidth=1;mctx.strokeRect((G.cam.x*k|0)+.5,(G.cam.y*k|0)+.5,VW*k|0,VH*k|0)}

function renderMenu(){
  if(!menuScene){const map=genMap(CITIES[5],777);prepMapArt(map);const ws=[];
    for(let i=0;i<46;i++){const t=pick(['walker','walker','walker','runner','brute','spitter','bloater']);let x,y,tries=0;
      do{x=rand(20,map.W*16-20);y=rand(20,map.H*16-20);tries++}while(SOLID[map.tiles[((y/16)|0)*map.W+((x/16)|0)]]&&tries<50);
      ws.push({x,y,vx:rand(-7,7),vy:rand(-5,5),fr:pick(ZSPR[t]),face:1,s:Math.random()*10})}
    menuScene={map,x:200,y:200,t:0,ws,flash:0,last:performance.now()}}
  const s=menuScene,now=performance.now(),dt=Math.min(.05,(now-s.last)/1000);s.last=now;s.t+=dt;
  const mw=s.map.W*16,mh=s.map.H*16;s.x=(mw-VW)/2+Math.cos(s.t*.04)*(mw-VW)/3;s.y=(mh-VH)/2+Math.sin(s.t*.03)*(mh-VH)/3;
  OX=Math.round(s.x*RZ);OY=Math.round(s.y*RZ);blitMap(s.map);
  s.ws.sort((a,b)=>a.y-b.y);
  for(const w of s.ws){w.x+=w.vx*dt;w.y+=w.vy*dt;if(Math.random()<.004){w.vx=rand(-7,7);w.vy=rand(-5,5)}w.face=w.vx<0?-1:1;
    if(w.x<s.x-30||w.x>s.x+VW+30||w.y<s.y-30||w.y>s.y+VH+40)continue;drawSpr(w.fr[((s.t*3+w.s)|0)%w.fr.length],w.x,w.y,w.face)}
  ctx.fillStyle='rgba(8,3,24,.5)';ctx.fillRect(0,0,LW,LH);
  if(Math.random()<.004)s.flash=1;if(s.flash>0){ctx.fillStyle=`rgba(255,240,190,${s.flash*.35})`;ctx.fillRect(0,0,LW,LH);s.flash-=dt*3}
  ctx.imageSmoothingEnabled=true;ctx.drawImage(vignette,0,0,LW,LH);ctx.imageSmoothingEnabled=K!==1}

  if(b.dataset.hero){save.heroine=b.dataset.hero;persist();Sfx.play('ui');showScreen('heroines');return}
  if(b.dataset.slot!==undefined){selSlot=+b.dataset.slot;showScreen('powers');return}
  if(b.dataset.power){const lo=[...loadout()],k=b.dataset.power,j=lo.indexOf(k);if(j>=0)lo[j]=lo[selSlot];lo[selSlot]=k;save.loadouts[save.heroine]=lo;persist();Sfx.play('ui');selSlot=(selSlot+1)%3;showScreen('powers');return}
  if(b.dataset.up){const k=b.dataset.up,c=upCost(save.up[k]);if(!save.god.infSup){if(save.supplies<c)return;save.supplies-=c}save.up[k]++;persist();Sfx.play('ui');showScreen(k==='power'||k==='vit'?'powers':'squad');return}
  if(b.dataset.recruit){const k=b.dataset.recruit,c=CLASSES[k];if(save.squad.length>=squadCap())return;if(!save.god.infSup){if(save.supplies<c.cost)return;save.supplies-=c.cost}
    const used=new Set(save.squad.map(s=>s.name)),free=NAMES.filter(n=>!used.has(n));save.squad.push({cls:k,name:free.length?pick(free):pick(NAMES)+' '+(save.squad.length+1),hair:pick(HAIRS)});persist();Sfx.play('ui');showScreen('squad');return}
  if(b.dataset.dismiss!==undefined){save.squad.splice(+b.dataset.dismiss,1);persist();showScreen('squad');return}
  if(b.dataset.tog){save.god[b.dataset.tog]=!save.god[b.dataset.tog];persist();Sfx.play('ui');b.classList.toggle('on');$('.screen:not([hidden]) .sup')&&($('.screen:not([hidden]) .sup').textContent=(save.god.infSup?'∞':save.supplies)+' supplies');return}
  const a=b.dataset.act;if(!a)return;
  if(a==='resume'){paused=false;showScreen(null);$('#hud').hidden=false}
  else if(a==='pgod'){returnTo='pause';showScreen('god')}
  else if(a==='sound'){save.sound=!save.sound;persist();showScreen('pause')}
  else if(a==='quit'){persist();paused=false;state='menu';$('#hud').hidden=true;G=null;showScreen('title')}
  else if(a==='retry'){startMission(G.idx,G.sandbox)}
  else if(a==='resetgod'){save.god=defaultGod();persist();showScreen('god')}
  else if(a==='maxgod'){Object.assign(save.god,{infHP:true,noCD:true,infSup:true,unlock:true,dmg:100,size:4,speed:3,atk:10,cd:.1,squadBonus:20});persist();showScreen('god')}
});
gameEl.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sl;if(!k)return;save.god[k]=+e.target.value;persist();const o=$('#o-'+k);const v=save.god[k];
  if(o)o.textContent=k==='squadBonus'?'+'+v:'×'+(+v).toFixed(v<10?(v%1?2:0):0)});
$('#btnPause').addEventListener('click',()=>{if(state!=='play'||G.ended)return;paused=true;held.fill(false);stick.id=null;$('#stick').hidden=true;stick.dx=stick.dy=0;$('#hud').hidden=true;returnTo='pause';showScreen('pause')});
$('#btnSquad').addEventListener('click',()=>{if(!G)return;G.squadMode=G.squadMode==='follow'?'hold':'follow';G.hold={x:G.p.x,y:G.p.y};$('#btnSquad').textContent=G.squadMode==='follow'?'Follow':'Hold';toast(G.squadMode==='follow'?'Squad: follow me':'Squad: hold this position')});
$('#btnSound').addEventListener('click',()=>{save.sound=!save.sound;persist();R.title()});
$('#btnFull').addEventListener('click',()=>{const d=document.documentElement;try{const r=document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(r&&r.catch)r.catch(()=>toast('Fullscreen is not available here'))}catch(e){toast('Fullscreen is not available here')}});
for(let i=0;i<3;i++){const b=$('#pw'+i);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();Sfx.init();held[i]=true;tryCast(i)});
  for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{held[i]=false})}
// sandbox spawner
const SBX=[['+10 Walkers',()=>spawnAround('walker',10)],['+10 Runners',()=>spawnAround('runner',10)],['+5 Spitters',()=>spawnAround('spitter',5)],['+5 Bloaters',()=>spawnAround('bloater',5)],
  ['+3 Brutes',()=>spawnAround('brute',3)],['+Boss',()=>spawnAround('boss',1)],['Horde ×60',()=>{['walker','runner','walker','spitter','bloater','walker'].forEach(t=>spawnAround(t,10))}],
  ['+Nest',()=>{const pos=freeSpot(140,220);if(pos){const hp=600;G.nests.push({kind:'n',x:pos.x,y:pos.y,r:10,hp,max:hp,spawnT:2,flash:0,dead:false})}}],
  ['+Soldier',()=>{const k=pick(Object.keys(CLASSES));G.squad.push(makeSoldier({cls:k,name:pick(NAMES),hair:pick(HAIRS)},G.squad.length));toast(`${CLASSES[k].name} joined (this run)`)}],
  ['Smite all',()=>{for(const z of G.zombies)if(!z.dead){addBolt(z.x,z.y-120,z.x,z.y-4,G.hime.bolt,2,.3,8);hurt(z,1e9)}G.fx.push({k:'flash',c:'#fff',t:.3,max:.3});Sfx.play('boom')}]];
$('#sbx').innerHTML=SBX.map((s,i)=>`<button class="btn small" data-sbx="${i}">${s[0]}</button>`).join('');
$('#sbx').addEventListener('pointerdown',e=>e.stopPropagation());
$('#sbx').addEventListener('click',e=>{const b=e.target.closest('[data-sbx]');if(b&&G){SBX[+b.dataset.sbx][1]();e.stopPropagation()}});
function freeSpot(r0,r1){const p=G.p;for(let i=0;i<40;i++){const a=rand(0,6.283),r=rand(r0,r1),x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r;if(!blocked(x,y,7))return{x,y}}return null}
function spawnAround(type,n){for(let i=0;i<n;i++){const s=freeSpot(130,230);if(s){const z=spawnZombie(type,s.x,s.y,true);sparks(z.x,z.y-4,'#7a2238',4)}}}

// joystick
gameEl.addEventListener('pointerdown',e=>{if(state!=='play'||paused||!G||G.ended)return;if(e.target.closest('button,#sbx,canvas#minimap'))return;
  if(stick.id===null&&e.clientX<innerWidth*.6){stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;stick.dx=stick.dy=0;const s=$('#stick');s.hidden=false;s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';$('#knob').style.transform='';}});
addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const l=Math.hypot(dx,dy),mx=50;if(l>mx){dx=dx/l*mx;dy=dy/l*mx}
  stick.dx=dx/mx;stick.dy=dy/mx;$('#knob').style.transform=`translate(${dx}px,${dy}px)`});
const endStick=e=>{if(e.pointerId!==stick.id)return;stick.id=null;stick.dx=stick.dy=0;$('#stick').hidden=true};
addEventListener('pointerup',endStick);addEventListener('pointercancel',endStick);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k==='escape'&&state==='play'&&!paused)$('#btnPause').click();if(k==='f'&&state==='play')$('#btnSquad').click()});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();held.fill(false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused&&G&&!G.ended)$('#btnPause').click()});
gameEl.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- BOOT ---------------- */
buildZombieSprites();
let last=performance.now(),pfN=0,pfT=0;
function frame(t){const raw=(t-last)/1000,dt=Math.min(.05,raw);last=t;
  // adaptive resolution: if the device can't hold ~38fps, render fewer pixels
  if(state==='play'&&!paused&&raw<.5){pfN++;pfT+=raw;if(pfN>=120){if(pfT/pfN>.026&&PXCAP>1.1e6){PXCAP*=.72;resize()}pfN=pfT=0}}try{if(state==='play'&&!paused&&G&&!G.ended)update(dt);else if(G&&G.ended){G.time+=dt;for(let i=G.fx.length-1;i>=0;i--){G.fx[i].t-=dt;if(G.fx[i].t<=0)G.fx.splice(i,1)}}render()}catch(err){console.error(err)}requestAnimationFrame(frame)}
showScreen('title');requestAnimationFrame(frame);
window.__vf={startMission,get G(){return G},save:()=>save,HEROINES,himeSprite};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
