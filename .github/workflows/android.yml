name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Wrap the game in a Capacitor Android project
        run: |
          mkdir -p build/www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png build/www/
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "Hime Blitz" com.ivndrs.himeblitz --web-dir www
          npx cap add android
          npx cap sync android
          # Use the game's pixel icon as the launcher icon
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do
            cp www/icon-192.png $d/ic_launcher.png
            cp www/icon-192.png $d/ic_launcher_round.png
          done

      - name: Build debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk HimeBlitz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HimeBlitz-apk
          path: HimeBlitz.apk

      - name: Publish APK to the "apk-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Hime Blitz – latest Android build
          prerelease: true
          files: HimeBlitz.apk
          body: |
            Download **HimeBlitz.apk** on your Android phone and open it to install.
            Android will ask you to allow installs from your browser or file manager the first time.
            Built from ${{ github.sha }}.
