name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset)
      - name: Wrap the game in a Capacitor Android project
        run: |
          mkdir -p build/www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png build/www/
          cp -r assets build/www/
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "Voltfall" com.ivndrs.voltfall --web-dir www
          npx cap add android
          npx cap sync android
          # Use the game's pixel icon as the launcher icon
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do
            cp www/icon-192.png $d/ic_launcher.png
            cp www/icon-192.png $d/ic_launcher_round.png
          done

      # Every build signs with the same key (tools/android/debug.keystore), so a new APK installs
      # over the old one and keeps your saves. The version comes from the VERSION file.
      - name: Fixed signing key and version number
        run: |
          mkdir -p ~/.android
          cp tools/android/debug.keystore ~/.android/debug.keystore
          VER=$(tr -d ' \n' < VERSION)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VER\"/" build/android/app/build.gradle
          grep -n "versionCode\|versionName" build/android/app/build.gradle

      - name: Build debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk Voltfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Voltfall-apk
          path: Voltfall.apk

      - name: Publish APK to the "apk-latest" release
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voltfall – latest Android build
          prerelease: true
          files: Voltfall.apk
          body: |
            Download **Voltfall.apk** on your Android phone and open it to install.
            Android will ask you to allow installs from your browser or file manager the first time.
            Built from ${{ github.sha }}.

      # A new number in the VERSION file becomes a full release (tag v<number>) the first time it is
      # pushed, so releases need no git tags from a phone. Later pushes of the same number only
      # update apk-latest.
      - name: Is this version released yet?
        id: ver
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d ' \n' < VERSION)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "${{ github.repository }}" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the new version as a release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Voltfall ${{ steps.ver.outputs.tag }}
          prerelease: false
          make_latest: true
          files: Voltfall.apk
          body_path: RELEASE_NOTES.md

      # a version tag (v1.0.0, v1.1.0, ...) becomes a full release with its own APK
      - name: Publish a versioned release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Voltfall ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: Voltfall.apk
          body: |
            Download **Voltfall.apk** on your Android phone and open it to install.
            Android will ask you to allow installs from your browser or file manager the first time.

            Voltfall is a pixel-art zombie apocalypse: lightning and speedster heroines, a squad of
            soldiers, adjustable God Mode, and 18 infected cities to take back, from the streets to
            the metro, the sewers and the rooftops.

            Built from ${{ github.sha }}.
